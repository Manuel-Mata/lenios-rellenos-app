services:
  # Backend Node.js Service
  - type: web
    name: lenios-backend
    env: node
    region: ohio
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lenios-db
          property: connectionString
      - key: PORT
        value: "5000"
      - key: NODE_ENV
        value: "production"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "https://lenios-frontend.onrender.com"

  # Frontend Vite Service
  - type: web
    name: lenios-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: "https://lenios-backend.onrender.com"

databases:
  - name: lenios-db
    databaseName: lenios
    user: lenios_user
    region: ohio
    plan: free
